name: E2E Automation Tests

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00 (UTC)
  workflow_dispatch: # Elle tetikleme

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Mock Server dependencies
      run: npm install --prefix mock-server

    - name: Run API Tests
      run: mvn clean verify -Dtest=ApiRunner

    - name: Upload API Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-logs
        path: target/logs/

  ui-live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      has_report: ${{ steps.check_report.outputs.has_report }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Microsoft Edge
      run: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/keyrings/microsoft-edge.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge-dev.list
        sudo apt-get update && sudo apt-get install -y microsoft-edge-stable

    - name: Run UI Tests
      id: ui_run
      continue-on-error: true
      env:
        CUCUMBER_FILTER_TAGS: "@ui and @amazon-live"
      run: mvn clean verify -Dtest=ChromeRunner,FirefoxRunner,EdgeRunner

    - name: UI Test Summary
      if: always()
      run: |
        SKIPPED=0
        if [ -f "target/surefire-reports/testng-results.xml" ]; then
          SKIPPED=$(grep -oP 'skipped="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1 || echo 0)
        else
          SKIPPED="bilinmiyor"
        fi
        echo "### UI Test Sonucu: ${{ steps.ui_run.outcome }}" >> $GITHUB_STEP_SUMMARY
        echo "Atlanan Senaryo Sayisi: $SKIPPED" >> $GITHUB_STEP_SUMMARY
        if [ "$SKIPPED" != "0" ] && [ "$SKIPPED" != "bilinmiyor" ]; then
          echo "::warning::UI testleri Amazon bot korumasi nedeniyle atlandi ($SKIPPED senaryo)"
        fi

    - name: Generate Allure Report
      if: always()
      run: mvn allure:report

    - name: Check Allure Report
      id: check_report
      if: always()
      run: |
        if [ -d "target/site/allure-maven-plugin" ]; then
          echo "has_report=true" >> $GITHUB_OUTPUT
        else
          echo "has_report=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Cucumber (Masterthought) Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-reports
        path: target/cucumber-report-*/

    - name: Upload Allure Report
      if: always() && steps.check_report.outputs.has_report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: target/site/allure-maven-plugin/

    - name: Upload UI Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-logs
        path: target/logs/

    - name: Prepare GitHub Pages
      if: always() && steps.check_report.outputs.has_report == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/site/allure-maven-plugin/

  deploy-report:
    needs: ui-live-tests
    if: always() && needs.ui-live-tests.outputs.has_report == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Allure Report URL
        if: always() && steps.deployment.outputs.page_url != ''
        run: |
          echo "### Allure Report Deployed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Report URL: [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "Allure Report deployed to: ${{ steps.deployment.outputs.page_url }}"
