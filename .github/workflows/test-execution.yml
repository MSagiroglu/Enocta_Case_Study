name: E2E Automation Tests

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00 (UTC)
  workflow_dispatch: # Elle tetikleme

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Mock server'i MockServerManager otomatik baslatir, sadece bagimliliklar kurulur
    - name: Install Mock Server dependencies
      run: npm install --prefix mock-server

    # ubuntu-latest uzerinde Chrome, Firefox ve Edge kurulu gelir.
    # GitHub Actions CI=true set eder -> Driver.java tarayicilari headless acar.
    - name: Run Tests (API + Chrome/Firefox/Edge paralel)
      run: mvn clean verify

    - name: Generate Allure Report
      if: always()
      run: mvn allure:report

    - name: Upload Cucumber (Masterthought) Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-reports
        path: target/cucumber-report-*/

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: target/site/allure-maven-plugin/

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: target/logs/

    - name: Prepare GitHub Pages
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/site/allure-maven-plugin/

  deploy-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
