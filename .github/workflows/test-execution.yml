name: E2E Automation Tests

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      selenium-hub:
        image: selenium/hub:4.16.1
        ports:
          - 4444:4444
      chrome:
        image: selenium/node-chrome:4.16.1
        shm-size: 2gb
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      firefox:
        image: selenium/node-firefox:4.16.1
        shm-size: 2gb
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      edge:
        image: selenium/node-edge:4.16.1
        shm-size: 2gb
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Start Mock Server
      run: |
        cd mock-server
        npm install
        node server.js &
        sleep 5
      
    - name: Run Maven Tests
      env:
        BROWSER: remote-chrome # Default fallback, TestNG handles parallel cross browser
        HUB_URL: http://localhost:4444/wd/hub
        MOCK_SERVER_URL: http://localhost:3000
      run: mvn clean verify

    - name: Upload Cucumber Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: unified-cucumber-report
        path: target/cucumber-html-reports/
        
    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-logs
        path: target/logs/
