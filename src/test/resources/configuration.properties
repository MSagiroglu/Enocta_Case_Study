# Varsayilan tarayici: chrome | firefox | edge
# Ezmek icin: mvn clean verify -Dsuite=single-browser.xml -Dbrowser=firefox  (veya BROWSER ortam degiskeni)
browser=chrome

# true: tarayicilar ekransiz acilir. GitHub Actions'ta (CI=true) otomatik acilir.
headless=false

# true: testler Selenium Grid uzerinde (RemoteWebDriver) kosar. Docker Compose bunu otomatik set eder.
remote=false
hub.url=http://localhost:4444/wd/hub

# Test edilen e-ticaret sitesi
base.url=https://www.amazon.com.tr

# API testlerinin istek attigi mock server
mock.server.url=http://localhost:3000
